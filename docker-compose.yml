services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stockwise
      POSTGRES_PASSWORD: stockwise
      POSTGRES_DB: stockwise
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockwise -d stockwise"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://stockwise:stockwise@db:5432/stockwise
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "8000:8000"

  # 独立调度进程：每日 06:30 测算 + 预警扫描（与 API 解耦，避免多 worker 重复触发）
  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.scheduler_worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://stockwise:stockwise@db:5432/stockwise
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
